name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm run install:all

      - name: Run backend and frontend tests
        run: npm test
        env:
          # Tests stub every outbound call; the secret only proves the key comes from
          # configuration and is never read from a committed file.
          AZURE_MAPS_KEY: ${{ secrets.AZURE_MAPS_KEY }}
