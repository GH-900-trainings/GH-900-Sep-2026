<!doctype html>
<html lang="en" data-bs-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Weather Dashboard — live city weather</title>
    <script>
      // Applied before first paint so the page never flashes the wrong theme.
      (() => {
        const stored = localStorage.getItem('theme');
        const dark = stored ? stored === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
        document.documentElement.setAttribute('data-bs-theme', dark ? 'dark' : 'light');
      })();
    </script>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      rel="stylesheet"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
      crossorigin=""
    />
    <link href="styles.css" rel="stylesheet" />
  </head>
  <body>
    <main class="container py-4 py-lg-5">
      <header class="dash-header d-flex flex-wrap justify-content-between align-items-center gap-3 mb-4">
        <div>
          <h1 class="dash-title mb-1">Weather Dashboard</h1>
          <p class="dash-sub mb-0">Current conditions by country, from Azure Maps.</p>
        </div>
        <div class="d-flex align-items-center gap-2">
          <span class="d-flex align-items-center gap-2" id="dash-controls">
            <span class="dash-updated" id="updated"></span>
            <button class="btn btn-outline-secondary btn-sm" id="refresh" type="button">Refresh</button>
          </span>
          <button class="btn btn-outline-secondary btn-sm" id="theme-toggle" type="button" aria-pressed="false">
            <span id="theme-label">Dark</span>
          </button>
        </div>
      </header>

      <div class="alert alert-warning d-none" id="alert" role="alert"></div>

      <div id="dashboard" aria-live="polite" aria-busy="true">
        <p class="dash-loading">Loading current conditions…</p>
      </div>

      <section id="detail" class="d-none" aria-live="polite">
        <a class="btn btn-outline-secondary btn-sm mb-3" href="#/">← Back to dashboard</a>

        <div class="d-flex align-items-center gap-2 mb-3">
          <img class="country-flag" id="detail-flag" width="40" height="30" alt="" decoding="async" />
          <div>
            <h2 class="detail-city mb-0" id="detail-city"></h2>
            <p class="detail-country mb-0" id="detail-country"></p>
          </div>
        </div>

        <div class="row g-3">
          <div class="col-lg-6">
            <article class="card city-card h-100">
              <div class="card-body d-flex flex-column">
                <div class="d-flex justify-content-between align-items-start gap-2">
                  <div>
                    <p class="city-temp mb-1" id="detail-temp"></p>
                    <p class="city-phrase mb-0" id="detail-phrase"></p>
                  </div>
                  <span class="detail-emoji" id="detail-emoji" role="img"></span>
                </div>
                <dl class="detail-stats mt-3 mb-0" id="detail-stats"></dl>
                <p class="detail-observed mt-3 mb-0" id="detail-observed"></p>
              </div>
            </article>
          </div>
          <div class="col-lg-6">
            <article class="card city-card h-100">
              <div class="card-body p-2">
                <div class="detail-map" id="map"></div>
              </div>
            </article>
          </div>
        </div>

        <section class="mt-4">
          <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
            <h3 class="section-title mb-0">Forecast</h3>
            <div class="btn-group btn-group-sm" role="group" aria-label="Forecast length">
              <button class="btn btn-outline-secondary active" type="button" data-days="5">5 days</button>
              <button class="btn btn-outline-secondary" type="button" data-days="7">7 days</button>
            </div>
          </div>
          <p class="forecast-summary mb-3" id="forecast-summary"></p>
          <div class="forecast-grid" id="forecast-days"></div>
        </section>
      </section>

      <noscript>
        <p class="alert alert-warning">This dashboard needs JavaScript to load weather data.</p>
      </noscript>
    </main>

    <template id="country-template">
      <section class="country-block mb-4 mb-lg-5">
        <div class="country-head d-flex align-items-center gap-2 mb-3">
          <img class="country-flag" width="40" height="30" alt="" decoding="async" />
          <h2 class="country-name mb-0"></h2>
          <span class="badge country-count"></span>
        </div>
        <div class="row row-cols-1 row-cols-md-2 row-cols-xl-3 g-3 country-cities"></div>
      </section>
    </template>

    <template id="city-template">
      <div class="col">
        <a class="card city-card h-100" href="#/">
          <div class="card-body d-flex flex-column">
            <div class="d-flex justify-content-between align-items-start gap-2">
              <h3 class="city-name mb-0"></h3>
              <span class="city-emoji" role="img"></span>
            </div>
            <p class="city-temp mb-1"></p>
            <p class="city-phrase mb-3"></p>
            <ul class="city-meta list-unstyled mt-auto mb-0">
              <li>Feels like <span class="city-feels"></span></li>
              <li>Humidity <span class="city-humidity"></span></li>
            </ul>
          </div>
        </a>
      </div>
    </template>

    <template id="forecast-template">
      <article class="card forecast-card">
        <div class="card-body text-center p-3">
          <p class="forecast-weekday mb-0"></p>
          <p class="forecast-date mb-2"></p>
          <span class="forecast-emoji" role="img"></span>
          <p class="forecast-range mb-1"></p>
          <p class="forecast-phrase mb-2"></p>
          <p class="forecast-rain mb-0"></p>
        </div>
      </article>
    </template>

    <script
      src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
      integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
      crossorigin=""
    ></script>
    <script src="app.js"></script>
  </body>
</html>
